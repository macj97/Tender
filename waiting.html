<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Tender</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <!-- Frontend -->
    <link rel="stylesheet" href="css/frontend.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/database/supabase-config.js"></script>
    <script defer src="js/database/cloud.js"></script>
    <script defer src="js/database/google-config.js"></script>
    <script defer src="js/database/settings.js"></script>
    <script defer src="js/frontend/restaurantInfo.js"></script>
    <script defer src="js/database/database.js"></script>
    <script defer src="js/backend/backend.js"></script>
    <script defer src="js/backend/places.js"></script>
    <script defer src="js/frontend/frontend.js"></script>
    <script defer src="js/frontend/pages.js"></script>

<body>

<div class="container-fluid">

    <div class="row my-md-5 my-3">

        <div id="header" class="container col-12 col-md-6 col-lg-4 text-center mx-auto">
            <img src="img/Tender-Logo.png" alt="Logo" style="width: 100px;height: 100px;" id="logo" class="my-md-2">
            <h1 id="welcome" class="my-5 fw-bold">Finding your matches</h1>
            <p class="instructions text-secondary text-center fs-3 my-5 mx-2">
                Comparing everyone's choices</p>
            <!-- id for pages.js -->
            <div id="waiting-spinner" class="spinner-border text-danger" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="instructions text-secondary text-center fs-3 my-5 mx-2">
                This will only take a moment</p>

            <!-- skip link -->
            <a href="results.html" class="text-secondary">See results</a>
        </div>

    </div>

</div>

</body>

</html>
