<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tender</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <!-- Frontend -->
    <link rel="stylesheet" href="css/frontend.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/database/supabase-config.js"></script>
    <script defer src="js/database/cloud.js"></script>
    <script defer src="js/database/google-config.js"></script>
    <script defer src="js/database/settings.js"></script>
    <script defer src="js/frontend/restaurantInfo.js"></script>
    <script defer src="js/database/database.js"></script>
    <script defer src="js/backend/backend.js"></script>
    <script defer src="js/backend/places.js"></script>
    <script defer src="js/frontend/frontend.js"></script>
    <script defer src="js/frontend/pages.js"></script>

</head>

<body>

<div class="container-fluid">

    <!-- header -->
    <div class="row border-bottom border-dark border-2">

        <a href="index.html" class="container col-8 col-md-10 d-flex justify-content-start text-decoration-none text-dark">
            <img src="img/Tender-Logo.png" alt="Logo" style="width: 50px;height: 50px;" id="logo" class="m-3">
            <h2 class="my-auto mx-3 fw-bold text-start">Tender</h2>
        </a>

        <div class="col-4 col-md-2 d-flex justify-content-end align-items-center">
            <!-- gear, filled in -->
            <i class="bi bi-gear-fill fs-1 mx-2 text-danger"></i>
            <a href="index.html" class="bi bi-info-circle fs-1 mx-2"></a>
        </div>
    </div>

    <div class="row my-3">
        <div class="container col-11 col-md-8 col-lg-5 mx-auto">

            <p class="fs-2 fw-bold mb-3">Settings</p>

            <!-- location -->
            <p class="fs-4 fw-bold mb-1">Your location</p>
            <p class="text-secondary">Tender needs this to find places near you.</p>

            <p><span class="fw-bold">Right now:</span>
                <span id="location-status" class="text-secondary">checking...</span></p>

            <button id="use-location" type="button" class="btn fw-bold text-white bg-danger">
                Share my location
            </button>

            <hr class="my-3">

            <!-- radius -->
            <p class="fs-4 fw-bold mb-1">How far you'll go: <span id="miles-bubble">5</span> miles</p>
            <p class="text-secondary">Anything further away than this wont show up.</p>

            <!-- 30 mile max -->
            <input type="range" class="form-range" id="distance-range-slider"
                min="1" max="30" step="1" value="5">
            <div class="d-flex justify-content-between text-secondary">
                <span>1 mile</span>
                <span>30 miles</span>
            </div>

            <hr class="my-3">

            <!-- saves on change -->
            <p id="saved-note" class="text-success fw-bold d-none">Saved</p>

            <button id="reset-settings" type="button" class="btn btn-outline-secondary fw-bold">
                Reset settings
            </button>

        </div>
    </div>

</div>

</body>

</html>
