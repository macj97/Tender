<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tender</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <!-- Frontend -->
    <link rel="stylesheet" href="css/frontend.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/database/supabase-config.js"></script>
    <script defer src="js/database/cloud.js"></script>
    <script defer src="js/database/google-config.js"></script>
    <script defer src="js/database/settings.js"></script>
    <script defer src="js/frontend/restaurantInfo.js"></script>
    <script defer src="js/database/database.js"></script>
    <script defer src="js/backend/backend.js"></script>
    <script defer src="js/backend/places.js"></script>
    <script defer src="js/frontend/frontend.js"></script>
    <script defer src="js/frontend/pages.js"></script>

</head>

<body>

<div class="container-fluid">

    <div class="row my-3">

        <div id="header" class="container col-11 col-md-6 col-lg-5 text-center mx-auto">
            <img src="img/Tender-Logo.png" alt="Logo" style="width: 64px;height: 64px;" id="logo">

            <h1 id="welcome" class="fs-2 fw-bold mt-2">Welcome to Tender</h1>

            <p id="instructions" class="text-secondary mb-3">Swipe nearby restaurants with your
                group and find a place everyone wants.</p>

            <!-- might change from numbered group to use the nice numbered icons from bootstrap-->
            <ul class="list-group list-group-numbered text-start mb-3">
                <li class="list-group-item py-1">Invite your group with one link</li>
                <li class="list-group-item py-1">Swipe yes or no on each place</li>
                <li class="list-group-item py-1">See what everyone agreed on</li>
            </ul>

            <!-- name box -->
            <input type="text" id="my-name" class="form-control form-control-lg text-center mb-2"
                placeholder="Your name" maxlength="20">
            <p id="name-error" class="text-danger d-none">Put your name in first.</p>

            <!-- pages.js hooks this up -->
            <a id="hungry-btn" class="btn fw-bold fs-3 text-white bg-danger w-100" href="groupselection.html">I'm hungry</a>

            <!-- settings link -->
            <p class="mt-2 mb-0">
                <a href="settings.html" class="text-secondary">
                    <i class="bi bi-gear"></i> Settings</a>
            </p>
        </div>

    </div>

</div>

</body>

</html>
