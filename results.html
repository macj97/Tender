<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tender</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <!-- Frontend -->
    <link rel="stylesheet" href="css/frontend.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/database/supabase-config.js"></script>
    <script defer src="js/database/cloud.js"></script>
    <script defer src="js/database/google-config.js"></script>
    <script defer src="js/database/settings.js"></script>
    <script defer src="js/frontend/restaurantInfo.js"></script>
    <script defer src="js/database/database.js"></script>
    <script defer src="js/backend/backend.js"></script>
    <script defer src="js/backend/places.js"></script>
    <script defer src="js/frontend/frontend.js"></script>
    <script defer src="js/frontend/pages.js"></script>

</head>

<body>

<div class="container-fluid">

    <!-- header -->
    <div class="row border-bottom border-dark border-2">

        <a href="index.html" class="container col-8 col-md-10 d-flex justify-content-start text-decoration-none text-dark">
            <img src="img/Tender-Logo.png" alt="Logo" style="width: 50px;height: 50px;" id="logo" class="m-3">
            <h2 class="my-auto mx-3 fw-bold text-start">Tender</h2>
        </a>

        <!-- settings icon -->
        <div class="col-4 col-md-2 d-flex justify-content-end align-items-center">
            <a href="settings.html" class="bi bi-gear fs-1 mx-2 text-dark"></a>

            <!-- information icon, links back to index.html page -->
            <a href="index.html" class="bi bi-info-circle fs-1 mx-2"></a>
        </div>
    </div>

    <div class="row my-md-5 my-1">
        <div class="container col-11 col-md-6 col-lg-4 mx-auto">
            <p class="fs-2 fw-bold mt-3">Results</p>
            <p class="text-body-tertiary mt-1 mb-md-5">Here's what you agreed upon, most liked first</p>

        </div>

        <div class="container col-11 col-md-10 mx-auto my-md-5 my-3">
            <!--frontend.js fills these in from the votes-->
            <ul class="list-group" id="results-list"></ul>
        </div>

    </div>

    <div class="row mb-4">
        <div class="container col-11 col-md-6 col-lg-4 mx-auto">
            <a id="button" class="btn fw-bold fs-5 text-white bg-danger rounded-3 w-100"
                href="index.html">Start over</a>
        </div>
    </div>

</div>

</body>

</html>
