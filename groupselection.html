<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tender</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <!-- Frontend -->
    <link rel="stylesheet" href="css/frontend.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/database/supabase-config.js"></script>
    <script defer src="js/database/cloud.js"></script>
    <script defer src="js/database/google-config.js"></script>
    <script defer src="js/database/settings.js"></script>
    <script defer src="js/frontend/restaurantInfo.js"></script>
    <script defer src="js/database/database.js"></script>
    <script defer src="js/backend/backend.js"></script>
    <script defer src="js/backend/places.js"></script>
    <script defer src="js/frontend/frontend.js"></script>
    <script defer src="js/frontend/pages.js"></script>

</head>

<body>

<div class="container-fluid">

    <!-- header -->
    <div class="row border-bottom border-dark border-2">

        <a href="index.html" class="container col-8 col-md-10 d-flex justify-content-start text-decoration-none text-dark">
            <img src="img/Tender-Logo.png" alt="Logo" style="width: 50px;height: 50px;" id="logo" class="m-3">
            <h2 class="my-auto mx-3 fw-bold text-start">Tender</h2>
        </a>

        <!-- settings icon -->
        <div class="col-4 col-md-2 d-flex justify-content-end align-items-center">
            <a href="settings.html" class="bi bi-gear fs-1 mx-2 text-dark"></a>

            <!-- information icon, links back to index.html page -->
            <a href="index.html" class="bi bi-info-circle fs-1 mx-2"></a>
        </div>
    </div>

    <div class="row my-3">
        <div class="container col-11 col-md-6 col-lg-4 mx-auto">
            <p class="fs-2 fw-bold mb-1">Your group</p>
            <p class="text-secondary mb-1">Send everyone the link, then start swiping.</p>

            <!-- pages.js fills this in -->
            <p class="text-secondary mb-3" id="group-distance"></p>

            <p class="fw-bold mb-1">Invite link</p>
            <div id="link_container" class="d-flex justify-content-between align-items-center bg-secondary-subtle rounded-3">
                <!--Temp link from prototype-->
                <p id="link" class="my-auto mx-3 fs-6 text-truncate">tender.com/g/asdfasdf747</p>

                <!-- copy button -->
                <button id="copy" class="btn bi bi-copy m-1 bg-white border text-danger text-nowrap"> Copy</button>

            </div>

            <a id="button" href="card.html" class="btn fw-bold fs-5 my-3 text-center text-white bg-danger rounded-3 w-100">
              Start swiping
            </a>

        </div>

        <div class="container col-11 col-md-6 col-lg-4 mx-auto">
            <p class="fs-2 fw-bold mb-1">Group Members</p>

            <p class="text-secondary mb-2">
                <i class="bi bi-circle-fill text-success"></i> joined
                <i class="bi bi-circle-fill text-secondary ms-3"></i> invited
            </p>

            <!--still to do: removing somebody needs supabase-->
            <!-- pages.js fills this in -->
            <ul class="list-group" id="member-list"></ul>
        </div>

    </div>

    <!-- join box -->
    <div class="modal" id="join-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Join this group</h5>
                </div>
                <div class="modal-body">
                    <p class="text-secondary">Your group will see your name next to what you picked.</p>

                    <label for="join-name" class="fw-bold">Your name</label>
                    <input type="text" id="join-name" class="form-control form-control-lg"
                        placeholder="e.g. Jay" maxlength="20">
                    <p id="join-error" class="text-danger d-none mt-2">Put your name in first.</p>
                </div>
                <div class="modal-footer">
                    <button id="join-btn" type="button" class="btn fw-bold text-white bg-danger w-100">Join group</button>
                </div>
            </div>
        </div>
    </div>

</div>

    </body>
</html>
